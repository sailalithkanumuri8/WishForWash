    <path d="M150 96v34m-6-6 6 6 6-6M330 96v34m-6-6 6 6 6-6"/>
    <path d="M62 236v24m-6-6 6 6 6-6M206 236v24m-6-6 6 6 6-6M350 236v24m-6-6 6 6 6-6"/>
  </g>
  <!-- groundwater -->
  <path d="M0 286c40-8 80 8 120 0s80-8 120 0 80 8 120 0 80-8 120 0v34H0Z" fill="#5087c4"/>
  <path d="M0 296c40-6 80 6 120 0s80-6 120 0 80 6 120 0 80-6 120 0" fill="none" stroke="#8fd3f0" stroke-width="2.5"/>
</svg>
