<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="stamps-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5087c4"/>
      <stop offset="1" stop-color="#8fd3f0"/>
    </linearGradient>
    <linearGradient id="stamps-soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6f4e"/>
      <stop offset="1" stop-color="#5e4a33"/>
    </linearGradient>
  </defs>
  <rect width="480" height="120" fill="url(#stamps-sky)"/>
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".6">
    <path d="M40 14l-8 18M110 40l-8 18M180 10l-8 18M250 50l-8 18M320 16l-8 18M390 44l-8 18M450 12l-8 18M70 76l-8 18M220 84l-8 18M360 80l-8 18"/>
  </g>
  <!-- field surface -->
  <rect y="108" width="480" height="24" fill="#7db77a"/>
  <path d="M0 108h480" stroke="#94c78f" stroke-width="4"/>
  <g stroke="#ffffff" stroke-width="2.5" opacity=".85"><path d="M240 108v24M60 108v24M420 108v24"/></g>
  <!-- goal posts -->
  <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"><path d="M48 108V74h24v34M408 108V74h24v34"/></g>
  <!-- soil -->
  <rect y="132" width="480" height="188" fill="url(#stamps-soil)"/>
  <g fill="#6b5640" opacity=".6"><circle cx="40" cy="270" r="5"/><circle cx="120" cy="300" r="4"/><circle cx="300" cy="286" r="6"/><circle cx="430" cy="300" r="4"/><circle cx="210" cy="150" r="3"/></g>
  <!-- infiltration cells (arched chambers in gravel) -->
  <rect x="20" y="150" width="440" height="78" rx="8" fill="#c9d2dc" opacity=".55"/>
  <g fill="#55b6da" stroke="#0e2a4f" stroke-width="2.5">
    <path d="M36 220v-34a26 26 0 0 1 52 0v34Z"/>
    <path d="M108 220v-34a26 26 0 0 1 52 0v34Z"/>
    <path d="M180 220v-34a26 26 0 0 1 52 0v34Z"/>
    <path d="M252 220v-34a26 26 0 0 1 52 0v34Z"/>
    <path d="M324 220v-34a26 26 0 0 1 52 0v34Z"/>
    <path d="M396 220v-34a26 26 0 0 1 52 0v34Z"/>
  </g>
  <g fill="#8fd3f0" opacity=".9"><rect x="38" y="200" width="48" height="18"/><rect x="110" y="200" width="48" height="18"/><rect x="182" y="200" width="48" height="18"/><rect x="254" y="200" width="48" height="18"/><rect x="326" y="200" width="48" height="18"/><rect x="398" y="200" width="48" height="18"/></g>
